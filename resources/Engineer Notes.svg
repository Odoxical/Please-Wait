         x="165.33789"
         y="266.59899"
         id="tspan2">Lorem ipsum dolor sit amet consectetur adipiscing elit. Dignissimos </tspan><tspan
         x="165.33789"
         y="289.93236"
         id="tspan3">qui dolor dolor vel cum et libero. Minim irure et dolorem quibusdam </tspan><tspan
         x="165.33789"
         y="313.26574"
         id="tspan4">odio laboris ducimus. Ah good. No ones reading anymore, except us. And </tspan><tspan
         x="165.33789"
         y="336.59911"
         id="tspan5">just incase anyone else is reading, heres a weak antimimetic attack. </tspan><tspan
         x="165.33789"
         y="359.93248"
         id="tspan6">You are now manually breathing. Your lips are rather dry, arent they? </tspan><tspan
         x="165.33789"
         y="383.26586"
         id="tspan7">their is no comfertable place in your mouth for your tounge. your </tspan><tspan
         x="165.33789"
         y="406.59923"
         id="tspan8">lips and anus are made of the same kind of skin. Coffee and alcohol </tspan><tspan
         x="165.33789"
         y="429.93261"
         id="tspan9">are both types of poison. Now no one else is actually reading, here's a </tspan><tspan
         x="165.33789"
         y="453.26598"
         id="tspan10">fun fact. The old advice of &quot;Just walk it off&quot; does actually work for </tspan><tspan
         x="165.33789"
         y="476.59935"
         id="tspan11">leg cramps. It feels odd in the preasent, but it reduces the amount of </tspan><tspan
         x="165.33789"
         y="499.93273"
         id="tspan12">pain anyone will feel in the future due to the cramp. Now, back to fun </tspan><tspan
         x="165.33789"
         y="523.2661"
         id="tspan13">facts with the creator. Have you ever heard of electroswing? its </tspan><tspan
         x="165.33789"
         y="546.59948"
         id="tspan14">quite a good genrea, and also quite fitting because we are back in the </tspan><tspan
         x="165.33789"
         y="569.93285"
         id="tspan15">roaring 20's, both because of the date, fast entertainment, and </tspan><tspan
         x="165.33789"
         y="593.26622"
         id="tspan16">immement stock market collapse. At least I hope it will stay mostly </tspan><tspan
         x="165.33789"
         y="616.5996"
         id="tspan17">constrained to the stock market. Also have a fun fact, your brain lies </tspan><tspan
         x="165.33789"
         y="639.93297"
         id="tspan18">to you. Our eyes are upside down, our brain just flips what we see. the </tspan><tspan
         x="165.33789"
         y="663.26635"
         id="tspan19">wavelength of pure red is 635 nm, the wave length of pure blue is 460, </tspan><tspan
         x="165.33789"
         y="686.59972"
         id="tspan20">there is no wave length for pure purple. Why? Becuase there is no such </tspan><tspan
         x="165.33789"
         y="709.93309"
         id="tspan21">thing as purple. Our brain just halucinates their being a mix between </tspan><tspan
         x="165.33789"
         y="733.26647"
         id="tspan22">red and blue. you don't need to be injured to feel pain. in fact, if </tspan><tspan
         x="165.33789"
         y="756.59984"
         id="tspan23">someone strokes your hand with a brush and a rubber hand at the same </tspan><tspan
         x="165.33789"
         y="779.93322"
         id="tspan24">time, within minutes if someone hits the rubber hand with a hammer </tspan><tspan
         x="165.33789"
         y="803.26659"
         id="tspan25">you will feel it within your real hand. Unfortuantly now, I have to </tspan><tspan
         x="165.33789"
         y="826.59996"
         id="tspan26">leave before anyone realises. But first, Remember, reality is an </tspan><tspan
         x="165.33789"
         y="849.93334"
         id="tspan27">illusion, the universe is a simulation, buy gold, byyyyye! Et omnis </tspan><tspan
         x="165.33789"
         y="873.26671"
         id="tspan28">duis in temporibus temporibus eligendi cillum temporibus. </tspan></text>
